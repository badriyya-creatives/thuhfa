<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poster Creator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Arima:wght@100..700&family=Noto+Sans+Malayalam:wght@100..900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Arima', sans-serif;
      background-color: #f0f0f0;
    }
    .poster-text {
      font-size: 4rem;
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: 0.03em;
      max-width: 2100px;
      margin: 0 auto;
      text-align: start;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .poster-bullet {
      display: flex;
      align-items: flex-start;
      padding-left: 4rem;
      position: relative;
    }

    .poster-bullet::before {
      content: '';
      position: absolute;
      top: 70px;
      left: 0;
      width: 2.5rem;
      height: 2.5rem;
      background-image: url('bullet.png');
      background-size: contain;
      background-repeat: no-repeat;
    }

    #dateText {
      font-family: 'Noto Sans Malayalam', sans-serif;
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 5.5rem;
      font-weight: 500;
      color: white;
      white-space: nowrap;
      max-width: 2600px;
      overflow: visible;
      text-overflow: ellipsis;
    }
    #title2Section {
      margin-top: 3rem;
    }
    textarea {
      font-family: 'Arima', sans-serif;
    }
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    .status-message {
      padding: 8px 16px;
      border-radius: 4px;
      margin: 8px 0;
      display: none;
    }
    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<<body class="bg-gray-100 min-h-screen p-3 md:p-6 text-gray-800">

  <div class="max-w-7xl mx-auto space-y-4">
    <!-- Status Messages -->
    <div id="statusMessage" class="status-message transition-all duration-300 shadow-md"></div>

    <!-- Main Controls Card -->
    <div class="bg-white rounded-xl shadow-md p-4 md:p-6 border border-gray-200">
      <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
        <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        പോസ്റ്റർ എഡിറ്റർ
      </h2>

      <!-- Hijri Month & Day Selector -->
      <div class="mb-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-semibold text-gray-700 mb-1.5 text-sm">മാസം:</label>
          <select id="monthSelect" class="w-full p-2.5 bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all cursor-pointer">
            <option disabled selected>മാസം തിരഞ്ഞെടുക്കുക</option>
          </select>
        </div>
        <div>
          <label class="block font-semibold text-gray-700 mb-1.5 text-sm">ദിവസം:</label>
          <select id="daySelect" class="w-full p-2.5 bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all cursor-pointer">
            <option disabled selected>ദിവസം തിരഞ്ഞെടുക്കുക</option>
            <option value="1">01</option>
            <option value="2">02</option>
            <option value="3">03</option>
            <option value="4">04</option>
            <option value="5">05</option>
            <option value="6">06</option>
            <option value="7">07</option>
            <option value="8">08</option>
            <option value="9">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
            <option value="13">13</option>
            <option value="14">14</option>
            <option value="15">15</option>
            <option value="16">16</option>
            <option value="17">17</option>
            <option value="18">18</option>
            <option value="19">19</option>
            <option value="20">20</option>
            <option value="21">21</option>
            <option value="22">22</option>
            <option value="23">23</option>
            <option value="24">24</option>
            <option value="25">25</option>
            <option value="26">26</option>
            <option value="27">27</option>
            <option value="28">28</option>
            <option value="29">29</option>
            <option value="30">30</option>
          </select>
        </div>
      </div>

      <!-- Input Fields -->
      <div class="space-y-3 mb-5">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Title 1 Content</label>
          <textarea id="input1" rows="5" placeholder="Enter Title 1 Content" class="w-full p-3 bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all font-sans"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Title 2 Content</label>
          <textarea id="input2" rows="5" placeholder="Enter Title 2 Content" class="w-full p-3 bg-gray-50 border border-gray-300 text-gray-900 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-all font-sans"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Generated Date String</label>
          <textarea id="input3" rows="2" readonly class="w-full p-3 bg-gray-100 border border-gray-300 text-gray-700 rounded-lg cursor-not-allowed font-semibold"></textarea>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center gap-3 pt-2 border-t border-gray-100">
        <button id="downloadBtn" onclick="downloadPoster()" class="flex-1 min-w-[160px] inline-flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-medium px-5 py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 active:scale-95 disabled:opacity-75 disabled:cursor-wait">
          <svg id="downloadIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          <svg id="downloadSpinner" class="hidden animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span id="downloadBtnText">Download</span>
        </button>

        <button id="saveBtn" onclick="saveData()" class="inline-flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-medium px-5 py-2.5 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 active:scale-95 disabled:opacity-75 disabled:cursor-not-allowed">
          <svg id="saveIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
          </svg>
          <svg id="saveSpinner" class="hidden animate-spin w-5 h-5 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span id="saveBtnText">Save</span>
        </button>

        <button id="deleteBtn" onclick="deleteData()" class="inline-flex items-center justify-center gap-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium px-4 py-2.5 rounded-lg border border-rose-200 transition-all duration-200 active:scale-95">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          <span>Delete</span>
        </button>
      </div>
    </div>

    <!-- Poster Preview -->
    <div id="posterPreviewWrapper" class="overflow-auto border border-gray-300 rounded-xl bg-gray-200 p-2 shadow-inner">
      <div id="posterScalePreview" class="scale-[0.3] origin-top-left">
        <div id="poster" class="relative w-[2700px] text-black" style="background: url('bg.png') no-repeat center; background-size: cover;">
          <img src="header.png" class="w-full" />
          <div class="relative">
            <img src="datebox.png" class="w-full" />
            <div id="dateText"></div>
          </div>
          <img src="title1.png" class="w-full" />
          <div id="text1" class="poster-text"></div>
          <div id="title2Section">
            <img id="title2Image" src="title2.png" class="w-full" />
            <div id="text2" class="poster-text"></div>
          </div>
          <img src="footer.png" class="w-full" />
        </div>
      </div>
    </div>
  </div>

  <script>
    // Supabase configuration
    const SUPABASE_URL = 'https://jnuyzhmeebaeeckkaobb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpudXl6aM1lZWJhZWVja2thb2JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMzNjkzNDUsImV4cCI6MjA2ODk0NTM0NX0.0dDorsXVM64DLrToS_NBEb6UaPO6AXNZvgXLdoacaa0';
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const hijriMonths = ["മുഹറം", "സഫർ", "റ:അവ്വല്‍", "റ:ആഖര്‍", "ജ:അവ്വല്‍", "ജ:ആഖര്‍", "റജബ്", "ശഅ്ബാന്‍", "റമളാന്‍", "ശവ്വാല്‍", "ദുല്‍ ഖഅദ്", "ദുല്‍ ഹജ്‌ജ"];
    const malayalamDays = ['ഞായര്‍', 'തിങ്കള്‍', 'ചൊവ്വ', 'ബുധന്‍', 'വ്യാഴം', 'വെള്ളി', 'ശനി'];
    const malayalamMonths = ['ജനുവരി', 'ഫെബ്രുവരി', 'മാര്‍ച്ച്', 'ഏപ്രില്‍', 'മേയ്', 'ജൂണ്‍', 'ജൂലൈ', 'ആഗസ്റ്റ്', 'സെപ്റ്റംബര്‍', 'ഒക്ടോബര്‍', 'നവംബര്‍', 'ഡിസംബര്‍'];

    const monthSelect = document.getElementById("monthSelect");
    const daySelect = document.getElementById("daySelect");
    const statusMessage = document.getElementById("statusMessage");
    const saveBtn = document.getElementById("saveBtn");
    const saveBtnText = document.getElementById("saveBtnText");
    const saveIcon = document.getElementById("saveIcon");
    const saveSpinner = document.getElementById("saveSpinner");
    const downloadBtn = document.getElementById("downloadBtn");
    const downloadBtnText = document.getElementById("downloadBtnText");
    const downloadIcon = document.getElementById("downloadIcon");
    const downloadSpinner = document.getElementById("downloadSpinner");

    // Populate month dropdown
    hijriMonths.forEach(month => {
      const option = document.createElement("option");
      option.value = month;
      option.textContent = month;
      monthSelect.appendChild(option);
    });

    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${isError ? 'status-error' : 'status-success'}`;
      statusMessage.style.display = 'block';
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 3000);
    }

    function setLoading(loading) {
      document.body.className = loading ? 'loading' : '';
      saveBtn.disabled = loading;
      if (loading) {
        saveIcon.classList.add('hidden');
        saveSpinner.classList.remove('hidden');
        saveBtnText.textContent = 'സേവ് ചെയ്യുന്നു...';
      } else {
        saveIcon.classList.remove('hidden');
        saveSpinner.classList.add('hidden');
        saveBtnText.textContent = 'Save';
      }
    }

    function setDownloadProgress(isDownloading, progressText = "Download") {
      downloadBtn.disabled = isDownloading;
      if (isDownloading) {
        downloadIcon.classList.add('hidden');
        downloadSpinner.classList.remove('hidden');
        downloadBtnText.textContent = progressText;
      } else {
        downloadIcon.classList.remove('hidden');
        downloadSpinner.classList.add('hidden');
        downloadBtnText.textContent = 'Download';
      }
    }

    function generateBulletText(input) {
      return input.split('\n').map(line => line.trim() ? `<div class="poster-bullet">${line}</div>` : '').join('');
    }

    function generatePoster() {
      const input1Value = document.getElementById('input1').value;
      const input2Value = document.getElementById('input2').value;
      const title2Section = document.getElementById('title2Section');
      
      // Update text content
      document.getElementById('text1').innerHTML = generateBulletText(input1Value);
      document.getElementById('text2').innerHTML = generateBulletText(input2Value);
      document.getElementById('dateText').innerText = document.getElementById('input3').value;
      
      // Show/hide Title 2 section based on input2 content
      if (input2Value.trim() === '') {
        title2Section.style.display = 'none';
      } else {
        title2Section.style.display = 'block';
      }
      
      document.getElementById('posterScalePreview').style.transform = "scale(0.3)";
    }

    async function downloadPoster() {
      const wrapper = document.getElementById("posterScalePreview");
      const originalTransform = wrapper.style.transform;

      setDownloadProgress(true, "തയ്യാറാകുന്നു...");

      try {
        // Step 1: Font Check
        if (document.fonts) {
          setDownloadProgress(true, "ഫോണ്ട് ലോഡ് ചെയ്യുന്നു...");
          await document.fonts.ready;
        }

        setDownloadProgress(true, "പോസ്റ്റർ ഇമേജ് തയ്യാറാക്കുന്നു...");

        wrapper.style.transform = "scale(1)";
        wrapper.style.transformOrigin = "top left";

        const posterEl = document.getElementById("poster");

        // Scroll to top left to prevent offset issues on mobile
        window.scrollTo(0, 0);

        const canvas = await html2canvas(posterEl, {
          scale: 2,
          useCORS: true,
          backgroundColor: null,
          width: posterEl.offsetWidth,
          height: posterEl.offsetHeight,
          windowWidth: 2700,
          scrollX: 0,
          scrollY: 0
        });

        wrapper.style.transform = originalTransform;
        setDownloadProgress(true, "ഡൗൺലോഡ് ചെയ്യുന്നു...");

        // Use Blob for better mobile browser download compatibility
        canvas.toBlob((blob) => {
          if (!blob) {
            setDownloadProgress(false);
            showStatus("ഇമേജ് സൃഷ്‌ടിക്കുന്നതിൽ പിശക്!", true);
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.download = "poster.png";
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 1000);

          setDownloadProgress(false);
          showStatus("ഡൗൺലോഡ് വിജയിച്ചു! ✅");
        }, "image/png");

      } catch (err) {
        wrapper.style.transform = originalTransform;
        setDownloadProgress(false);
        console.error("Download error:", err);
        showStatus("ഡൗൺലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു!", true);
      }
    }

    async function saveData() {
      const month = monthSelect.value;
      const day = daySelect.value;
      
      if (!month || !day) {
        showStatus("ദിവസവും മാസവും തിരഞ്ഞെടുക്കണം!", true);
        return;
      }

      setLoading(true);

      try {
        const data = {
          hijri_month: month,
          hijri_day: parseInt(day),
          title1_content: document.getElementById('input1').value,
          title2_content: document.getElementById('input2').value
        };

        const { error } = await supabaseClient
          .from('poster_data')
          .upsert(data, { 
            onConflict: 'hijri_month,hijri_day',
            ignoreDuplicates: false 
          });

        if (error) {
          throw error;
        }

        showStatus("സേവ് ചെയ്തു ✅");
      } catch (error) {
        console.error('Save error:', error);
        showStatus("സേവ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു!", true);
      } finally {
        setLoading(false);
      }
    }

    async function loadSavedData() {
      const month = monthSelect.value;
      const day = daySelect.value;
      
      if (!month || !day) return;

      try {
        const { data, error } = await supabaseClient
          .from('poster_data')
          .select('title1_content, title2_content')
          .eq('hijri_month', month)
          .eq('hijri_day', parseInt(day))
          .single();

        if (error && error.code !== 'PGRST116') { // PGRST116 is "not found" error
          throw error;
        }

        if (data) {
          document.getElementById('input1').value = data.title1_content || '';
          document.getElementById('input2').value = data.title2_content || '';
        } else {
          document.getElementById('input1').value = '';
          document.getElementById('input2').value = '';
        }
      } catch (error) {
        console.error('Load error:', error);
        showStatus("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു!", true);
        // Clear inputs on error
        document.getElementById('input1').value = '';
        document.getElementById('input2').value = '';
      }

      updateAutoDate();
      generatePoster();
    }

    async function deleteData() {
      const month = monthSelect.value;
      const day = daySelect.value;
      
      if (!month || !day) {
        showStatus("ദിവസവും മാസവും തിരഞ്ഞെടുക്കണം!", true);
        return;
      }

      if (!confirm("ഈ ഡാറ്റ ഡിലീറ്റ് ചെയ്യാൻ ശരിക്കും ആഗ്രഹിക്കുന്നുണ്ടോ?")) {
        return;
      }

      try {
        const { error } = await supabaseClient
          .from('poster_data')
          .delete()
          .eq('hijri_month', month)
          .eq('hijri_day', parseInt(day));

        if (error) {
          throw error;
        }

        document.getElementById('input1').value = '';
        document.getElementById('input2').value = '';
        generatePoster();
        showStatus("ഡാറ്റ ഡിലീറ്റ് ചെയ്തു ✅");
      } catch (error) {
        console.error('Delete error:', error);
        showStatus("ഡിലീറ്റ് ചെയ്യുന്നതിൽ പിശക് സംഭവിച്ചു!", true);
      }
    }

    function updateAutoDate() {
      const month = monthSelect.value;
      const day = daySelect.value;
      if (!month || !day) return;

      const today = new Date();
      const weekday = malayalamDays[today.getDay()];
      const engDay = String(today.getDate()).padStart(2, '0');
      const engMonth = malayalamMonths[today.getMonth()];
      const engYear = today.getFullYear();

      const fullDate = `1448 ${month} ${day.padStart(2, '0')} | ${weekday} | ${engYear} ${engMonth} ${engDay}`;
      document.getElementById('input3').value = fullDate;
    }

    // Event listeners
    ['input1', 'input2'].forEach(id => {
      document.getElementById(id).addEventListener('input', generatePoster);
    });

    monthSelect.addEventListener('change', loadSavedData);
    daySelect.addEventListener('change', loadSavedData);

    // Initialize on page load
    window.onload = () => {
      generatePoster();
      // Test Supabase connection
      supabaseClient.from('poster_data').select('count').single()
        .then(() => console.log('Supabase connected successfully'))
        .catch(err => {
          console.error('Supabase connection error:', err);
          showStatus("ഡാറ്റാബേസ് കണക്ഷൻ പിശക്!", true);
        });
    };
  </script>
</body>
</html>
