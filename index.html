  <style>
    html, body {
      overflow-x: hidden;
      max-width: 100vw;
    }
    body {
      font-family: 'Arima', sans-serif;
      background-color: #f1f5f9;
    }
    #posterPreviewWrapper {
      overflow: hidden !important;
      max-width: 100%;
    }
    .poster-text {
      font-size: 4rem;
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: 0.03em;
      max-width: 2100px;
      margin: 0 auto;
      text-align: start;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .poster-bullet {
      display: flex;
      align-items: flex-start;
      padding-left: 4rem;
      position: relative;
    }

    .poster-bullet::before {
      content: '';
      position: absolute;
      top: 70px;
      left: 0;
      width: 2.5rem;
      height: 2.5rem;
      background-image: url('bullet.png');
      background-size: contain;
      background-repeat: no-repeat;
    }

    #dateText {
      font-family: 'Noto Sans Malayalam', sans-serif;
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 5.5rem;
      font-weight: 500;
      color: white;
      white-space: nowrap;
      max-width: 2600px;
      overflow: visible;
      text-overflow: ellipsis;
    }
    #title2Section {
      margin-top: 3rem;
    }
    textarea {
      font-family: 'Arima', sans-serif;
    }
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    .status-message {
      padding: 12px 18px;
      border-radius: 12px;
      margin: 8px 0;
      display: none;
      font-weight: 700;
    }
    .status-success {
      background-color: #00c853;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
    }
    .status-error {
      background-color: #ff1744;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(255, 23, 68, 0.3);
    }

    /* Ultra Vivid Solid Buttons */

    const hijriMonths = ["മുഹറം", "സഫർ", "റ:അവ്വല്‍", "റ:ആഖര്‍", "ജ:അവ്വല്‍", "ജ:ആഖര്‍", "റജബ്", "ശഅ്ബാന്‍", "റമളാന്‍", "ശവ്വാല്‍", "ദുല്‍ ഖഅദ്", "ദുല്‍ ഹജ്‌ജ"];

    const downloadBtnText = document.getElementById("downloadBtnText");
    const downloadIcon = document.getElementById("downloadIcon");
    const downloadSpinner = document.getElementById("downloadSpinner");
    const shareBtn = document.getElementById("shareBtn");
    const shareBtnText = document.getElementById("shareBtnText");
    const shareIcon = document.getElementById("shareIcon");
    const shareSpinner = document.getElementById("shareSpinner");

    hijriMonths.forEach(month => {
      const option = document.createElement("option");
      option.value = month;
      option.textContent = month;
      monthSelect.appendChild(option);
    });

    function showStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${isError ? 'status-error' : 'status-success'}`;
      statusMessage.style.display = 'block';
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 3000);
    }

    function setLoading(loading) {
      document.body.className = loading ? 'loading' : '';
      saveBtn.disabled = loading;
      if (loading) {
        saveIcon.classList.add('hidden');
        saveSpinner.classList.remove('hidden');
        saveBtnText.textContent = 'Saving...';
      } else {
        saveIcon.classList.remove('hidden');
        saveSpinner.classList.add('hidden');
        saveBtnText.textContent = 'Save';
      }
    }

    function setDownloadProgress(isDownloading, progressText = "Download") {
      downloadBtn.disabled = isDownloading;
      if (isDownloading) {
        downloadIcon.classList.add('hidden');
        downloadSpinner.classList.remove('hidden');
        downloadBtnText.textContent = progressText;
      } else {
        downloadIcon.classList.remove('hidden');
        downloadSpinner.classList.add('hidden');
        downloadBtnText.textContent = 'Download';
      }
    }

    function setShareProgress(isSharing, progressText = "Share") {
      shareBtn.disabled = isSharing;
      if (isSharing) {
        shareIcon.classList.add('hidden');
        shareSpinner.classList.remove('hidden');
        shareBtnText.textContent = progressText;
      } else {
        shareIcon.classList.remove('hidden');
        shareSpinner.classList.add('hidden');
        shareBtnText.textContent = 'Share';
      }
    }

    function fitPosterPreview() {
      const wrapper = document.getElementById("posterPreviewWrapper");
      const scalePreview = document.getElementById("posterScalePreview");
      const posterEl = document.getElementById("poster");
      if (!wrapper || !scalePreview || !posterEl) return;

      const availableWidth = wrapper.getBoundingClientRect().width;
      if (availableWidth <= 0) return;

      const scale = availableWidth / 2700;
      scalePreview.style.transform = `scale(${scale})`;
      scalePreview.style.transformOrigin = "top left";
      scalePreview.style.width = "2700px";

      const scaledHeight = posterEl.offsetHeight * scale;
      if (scaledHeight > 0) {
        wrapper.style.height = `${scaledHeight}px`;
      }
    }

    function generateBulletText(input) {
      return input.split('\n').map(line => line.trim() ? `<div class="poster-bullet">${line}</div>` : '').join('');
    }

    function generatePoster() {
      const input1Value = document.getElementById('input1').value;
      const input2Value = document.getElementById('input2').value;
      const title2Section = document.getElementById('title2Section');
      
      document.getElementById('text1').innerHTML = generateBulletText(input1Value);
      document.getElementById('text2').innerHTML = generateBulletText(input2Value);
      document.getElementById('dateText').innerText = document.getElementById('input3').value;
      
      if (input2Value.trim() === '') {
        title2Section.style.display = 'none';
      } else {
        title2Section.style.display = 'block';
      }
      
      setTimeout(fitPosterPreview, 50);
    }

    async function capturePosterCanvas() {
      const wrapper = document.getElementById("posterScalePreview");
      const previewWrapper = document.getElementById("posterPreviewWrapper");
      const posterEl = document.getElementById("poster");

      // Save original styles
      const originalTransform = wrapper.style.transform;
      const originalWrapperHeight = previewWrapper.style.height;

      try {
        // Temporarily unclip wrapper so mobile viewport width doesn't force text wrapping
        previewWrapper.style.overflow = "visible";
        wrapper.style.transform = "scale(1)";
        wrapper.style.transformOrigin = "top left";
        previewWrapper.style.height = `${posterEl.offsetHeight}px`;

        // Ensure Malayalam fonts & layout reflow at 2700px width before html2canvas
        if (document.fonts) {
          await document.fonts.ready;
        }
        await new Promise(resolve => setTimeout(resolve, 120));

        window.scrollTo(0, 0);

        const canvas = await html2canvas(posterEl, {
          scale: 2,
          useCORS: true,
          backgroundColor: null,
          width: 2700,
          height: posterEl.offsetHeight,
          windowWidth: 2700,
          scrollX: 0,
          scrollY: 0
        });

        return canvas;
      } finally {
        // Always restore mobile preview scale
        wrapper.style.transform = originalTransform;
        previewWrapper.style.height = originalWrapperHeight;
        previewWrapper.style.overflow = "hidden";
        fitPosterPreview();
      }
    }

    async function downloadPoster() {
      setDownloadProgress(true, "Preparing...");

      try {
        setDownloadProgress(true, "Rendering...");
        const canvas = await capturePosterCanvas();
        setDownloadProgress(true, "Downloading...");

        canvas.toBlob((blob) => {
          if (!blob) {
            setDownloadProgress(false);
            showStatus("Failed to create image!", true);
            return;
          }
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.download = "poster.png";
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 1000);

          setDownloadProgress(false);
          showStatus("Downloaded successfully! ✅");
        }, "image/png");

      } catch (err) {
        setDownloadProgress(false);
        console.error("Download error:", err);
        showStatus("Download failed!", true);
      }
    }

    async function sharePoster() {
      setShareProgress(true, "Preparing...");

      try {
        setShareProgress(true, "Rendering...");
        const canvas = await capturePosterCanvas();
        setShareProgress(true, "Sharing...");

        canvas.toBlob(async (blob) => {
          setShareProgress(false);
          if (!blob) {
            showStatus("Failed to create image!", true);
            return;
          }

          const file = new File([blob], "poster.png", { type: "image/png" });
          const targetPhone = "919946667559";

          // Try native Web Share API with image file only (no extra text/names below)
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: 'Badriyya Thuhfa',
                files: [file]
              });
              showStatus("Shared successfully! ✅");
              return;
            } catch (err) {
              if (err.name === 'AbortError') return;
            }
          }

          // Direct WhatsApp Fallback to +91 9946667559 (without caption text)
          window.open(`https://wa.me/${targetPhone}`, '_blank');
          showStatus("Opened WhatsApp! ✅");
        }, "image/png");

      } catch (err) {
        setShareProgress(false);
        console.error("Share error:", err);
        showStatus("Share failed!", true);
      }
    }

    async function saveData() {
      const month = monthSelect.value;
      const day = daySelect.value;
      
      if (!month || !day) {
        showStatus("Please select month and day!", true);
        return;
      }

      setLoading(true);

      try {
        const data = {
          hijri_month: month,
          hijri_day: parseInt(day),
          title1_content: document.getElementById('input1').value,
          title2_content: document.getElementById('input2').value,
          whatsapp_numbers: document.getElementById('inputWhatsapp').value
        };

        const { error } = await supabaseClient
          .from('poster_data')
          .upsert(data, { 
            onConflict: 'hijri_month,hijri_day',
            ignoreDuplicates: false 
          });

        if (error) {
          throw error;
        }

        showStatus("Saved successfully! ✅");
      } catch (error) {
        console.error('Save error:', error);
        showStatus("Failed to save!", true);
      } finally {
        setLoading(false);
      }
    }

    async function loadSavedData() {
      const month = monthSelect.value;
      const day = daySelect.value;
      
      if (!month || !day || month.includes("തിരഞ്ഞെടുക്കുക") || day.includes("തിരഞ്ഞെടുക്കുക")) return;

      try {
        const { data, error } = await supabaseClient
          .from('poster_data')
          .select('title1_content, title2_content, whatsapp_numbers')
          .eq('hijri_month', month)
          .eq('hijri_day', parseInt(day));

        if (error) {
          console.error('Supabase fetch error:', error);
          return;
        }

        if (data && data.length > 0) {
          document.getElementById('input1').value = data[0].title1_content || '';
          document.getElementById('input2').value = data[0].title2_content || '';
          document.getElementById('inputWhatsapp').value = data[0].whatsapp_numbers || '';
        } else {
          document.getElementById('input1').value = '';
          document.getElementById('input2').value = '';
          document.getElementById('inputWhatsapp').value = '';
        }
      } catch (error) {
        console.error('Load error:', error);
      }

      updateAutoDate();
      generatePoster();
    }

    async function deleteData() {
      const month = monthSelect.value;
      const day = daySelect.value;
      
      if (!month || !day) {
        showStatus("Please select month and day!", true);
        return;
      }

      if (!confirm("Are you sure you want to delete this data?")) {
        return;
      }

      try {
        const { error } = await supabaseClient
          .from('poster_data')
          .delete()
          .eq('hijri_month', month)
          .eq('hijri_day', parseInt(day));

        if (error) {
          throw error;
        }

        document.getElementById('input1').value = '';
        document.getElementById('input2').value = '';
        generatePoster();
        showStatus("Deleted successfully! ✅");
      } catch (error) {
        console.error('Delete error:', error);
        showStatus("Failed to delete!", true);
      }
    }

    function updateAutoDate() {
      const month = monthSelect.value;
      const day = daySelect.value;
      if (!month || !day) return;

      const today = new Date();
      const weekday = malayalamDays[today.getDay()];
      const engDay = String(today.getDate()).padStart(2, '0');
      const engMonth = malayalamMonths[today.getMonth()];
      const engYear = today.getFullYear();

      const fullDate = `1448 ${month} ${day.padStart(2, '0')} | ${weekday} | ${engYear} ${engMonth} ${engDay}`;
      document.getElementById('input3').value = fullDate;
    }

    // Event listeners
    ['input1', 'input2'].forEach(id => {
      document.getElementById(id).addEventListener('input', generatePoster);
    });

    monthSelect.addEventListener('change', loadSavedData);
    daySelect.addEventListener('change', loadSavedData);
    window.addEventListener('resize', fitPosterPreview);

    // Initialize on page load
    window.onload = () => {
      generatePoster();
      fitPosterPreview();

      // Ensure fit after background and poster images load
      document.querySelectorAll('#poster img').forEach(img => {
        if (img.complete) fitPosterPreview();
        else img.onload = fitPosterPreview;
      });

      // Test Supabase connection
      supabaseClient.from('poster_data').select('count').single()
        .then(() => console.log('Supabase connected successfully'))
        .catch(err => {
          console.error('Supabase connection error:', err);
          showStatus("ഡാറ്റാബേസ് കണക്ഷൻ പിശക്!", true);
        });
    };
  </script>
</body>
</html>
